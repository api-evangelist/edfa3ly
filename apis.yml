aid: edfa3ly
name: Edfa3ly
description: 'Edfa3ly is an Egyptian cross-border e-commerce and online shopping
  platform that lets consumers in Egypt and the wider MENA region buy products from
  international retailers and marketplaces, then handles the international shipping,
  customs clearance, and local delivery on their behalf. It bridges shoppers to
  overseas stores by managing purchasing, logistics, and payment in local currency.
  Edfa3ly is a 500 Global (500 Startups) portfolio company. This profile was added
  to the API Evangelist network as a portfolio-lead stub; the company does not
  publish a public developer program or API at this time.'
